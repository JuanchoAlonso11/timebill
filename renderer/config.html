<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>Smart Hours — Configuración</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #e8e8e8; }
    }
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f0;
      --color-background-info: #e6f1fb;
      --color-background-success: #f0fdf4;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #6b7280;
      --color-text-tertiary: #9ca3af;
      --color-text-info: #0c447c;
      --color-text-success: #15803d;
      --color-border-tertiary: rgba(0,0,0,0.1);
      --color-border-secondary: rgba(0,0,0,0.18);
      --color-border-info: #85b7eb;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --border-radius-md: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1e1e1e;
        --color-background-secondary: #2a2a2a;
        --color-background-info: #0c2d4a;
        --color-background-success: #052e16;
        --color-text-primary: #e8e8e8;
        --color-text-secondary: #a1a1aa;
        --color-text-tertiary: #71717a;
        --color-text-info: #93c5fd;
        --color-text-success: #86efac;
        --color-border-tertiary: rgba(255,255,255,0.1);
        --color-border-secondary: rgba(255,255,255,0.18);
        --color-border-info: #1e4d7a;
      }
    }
    input, select, button, textarea {
      font-family: var(--font-sans);
      font-size: 13px;
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      padding: 7px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--color-border-info); }
    button { cursor: pointer; background: var(--color-background-primary); }
    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/config/main.jsx"></script>
</body>
</html>
